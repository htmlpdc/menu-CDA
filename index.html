:root{
  --navy: #00216f;
  --sky: #7dbfe6;
  --teal: #5db9a3;
  --red: #ce392c;
  --green: #72bd53;
  --orange: #ff5100;
  --lime: #b8e44f;
  --amber: #f3b24e;
  --steel: #95adb5;
  --gray: #606060;
  --white: #ffffff;
  --ink: #0f141b;
  --bg: #eef0f1;
  --card-radius: 22px;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background: var(--bg);
  color: var(--ink);
  font-family:'Museo Sans Rounded', sans-serif;
  font-weight:300;
  min-height:100vh;
  transition: background .35s ease;
}

body.cena-mode{
  background: var(--ink);
}
body.cena-mode .week-label .num{ color: var(--sky); }
body.cena-mode .week-label .range{ color: var(--steel); }
body.cena-mode .week-label .rule{ opacity:0.28; }
body.cena-mode .history-toggle{
  background: transparent;
  border-color: var(--steel);
  color: var(--steel);
}
body.cena-mode .history-toggle:hover{ border-color: var(--sky); color: var(--sky); }

.wrap{
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px 70px;
}

/* ---------- HERO ---------- */
.hero{
  background: var(--navy);
  background-image: linear-gradient(135deg, var(--navy) 55%, #002d8f 100%);
  border-radius: 0 0 32px 32px;
  padding: 44px 24px 34px;
  margin-bottom: 34px;
  text-align:center;
  color: var(--white);
  position: relative;
  overflow:hidden;
}
.hero::before{
  content:"";
  position:absolute;
  right:-60px; top:-60px;
  width:220px; height:220px;
  border-radius:50%;
  background: var(--sky);
  opacity:0.18;
}
.hero::after{
  content:"";
  position:absolute;
  left:-40px; bottom:-70px;
  width:180px; height:180px;
  border-radius:50%;
  background: var(--lime);
  opacity:0.13;
}
.hero .eyebrow{
  font-weight:700;
  font-size: 13px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color: var(--sky);
  margin-bottom:10px;
  position:relative;
}
.hero h1{
  font-family:'Museo Sans Rounded Black','Museo Sans Rounded',sans-serif;
  font-weight:900;
  font-size: clamp(2rem, 5vw, 3.1rem);
  margin:0 0 10px;
  position:relative;
}
.hero p{
  font-weight:300;
  font-size:14.5px;
  color: rgba(255,255,255,0.78);
  max-width:460px;
  margin:0 auto;
  line-height:1.55;
  position:relative;
}
.today-strip{
  margin-top:22px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius:999px;
  padding:9px 20px;
  font-size:13px;
  font-weight:700;
  position:relative;
}
.today-strip .dot{
  width:8px;height:8px;border-radius:50%;
  background: var(--lime);
  box-shadow: 0 0 0 4px rgba(184,228,79,0.25);
}

/* ---------- TABS ---------- */
.controls{
  display:flex;
  justify-content:center;
  margin-bottom: 32px;
}
.meal-tabs{
  display:inline-flex;
  background: var(--white);
  border-radius:999px;
  padding:5px;
  box-shadow: 0 4px 14px rgba(0,33,111,0.1);
}
.meal-tabs button{
  font-family:inherit;
  font-weight:700;
  font-size:15px;
  padding:11px 28px;
  border:none;
  border-radius:999px;
  background:transparent;
  color: var(--navy);
  cursor:pointer;
  transition: all .22s ease;
}
.meal-tabs button.active{
  background: var(--navy);
  color: var(--white);
}

/* ---------- WEEK BLOCKS ---------- */
.week-block{ margin-bottom:38px; }
.week-label{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin-bottom:16px;
  padding-left:2px;
}
.week-label .num{
  font-weight:900;
  font-size:1.35rem;
  color: var(--navy);
}
.week-label .range{
  font-weight:700;
  font-size:12px;
  color: var(--gray);
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.week-label .rule{
  flex:1; height:2px;
  background: repeating-linear-gradient(90deg, var(--steel) 0 6px, transparent 6px 12px);
  opacity:0.5;
}

.day-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap:16px;
}

/* ---------- DAY CARD ---------- */
.ticket{
  position:relative;
  background: var(--white);
  border-radius: var(--card-radius);
  padding: 0 0 16px;
  box-shadow: 0 6px 18px rgba(0,33,111,0.08);
  overflow:hidden;
  transition: transform .2s ease, box-shadow .2s ease;
}
.ticket:hover{
  transform: translateY(-4px);
  box-shadow: 0 12px 26px rgba(0,33,111,0.16);
}
.ticket .day-head{
  background: var(--accent, var(--navy));
  color: var(--white);
  padding: 16px 16px 30px;
  position:relative;
  border-radius: var(--card-radius) var(--card-radius) 50% 50% / var(--card-radius) var(--card-radius) 22px 22px;
}
.ticket .day-name{
  font-family:'Museo Sans Rounded Black','Museo Sans Rounded',sans-serif;
  font-weight:900;
  font-size:1.2rem;
  display:block;
  text-transform:capitalize;
}
.ticket .day-date{
  font-weight:700;
  font-size:12px;
  opacity:0.85;
  letter-spacing:0.03em;
}

.badge{
  position:absolute;
  top:12px; right:12px;
  font-weight:900;
  font-size:10px;
  letter-spacing:0.06em;
  padding:4px 10px;
  border-radius:999px;
  background: var(--white);
}
.badge.hoy{ color: var(--red); }
.badge.proximo{ color: var(--navy); }

.item-list{ list-style:none; margin:0; padding: 6px 16px 0; }
.item-list li{
  padding:7px 0;
  border-top:1px solid #eef0f1;
  font-size:12.5px;
  line-height:1.35;
}
.item-list li:first-child{ border-top:none; }
.item-list .lbl{
  display:block;
  font-weight:700;
  font-size:9.5px;
  color: var(--accent, var(--navy));
  letter-spacing:0.05em;
  margin-bottom:1px;
  text-transform:uppercase;
}
.item-list .val{
  font-weight:700;
  color: var(--ink);
  text-transform:capitalize;
}

/* ---------- HISTORY ---------- */
.history-toggle{
  display:block;
  margin: 10px auto 40px;
  background: var(--white);
  border: 2px dashed var(--steel);
  color: var(--gray);
  font-family:inherit;
  font-weight:700;
  font-size:12.5px;
  padding:11px 22px;
  border-radius:999px;
  cursor:pointer;
  transition: all .2s ease;
}
.history-toggle:hover{ border-color: var(--navy); color: var(--navy); }

.history-wrap{ display:none; }
.history-wrap.open{ display:block; }
.history-wrap .day-grid .ticket{ opacity:0.55; filter:grayscale(0.5); }
.history-wrap .ticket::after{
  content:"SERVIDO";
  position:absolute;
  top:48%; left:50%;
  transform:translate(-50%,-50%) rotate(-14deg);
  font-weight:900;
  font-size:15px;
  letter-spacing:0.15em;
  color: var(--red);
  border:2px solid var(--red);
  padding:3px 12px;
  border-radius:6px;
  background:rgba(255,255,255,0.85);
}

/* ---------- EMPTY STATE ---------- */
.empty-state{
  text-align:center;
  padding:60px 20px;
  background: var(--white);
  border-radius: var(--card-radius);
  box-shadow: 0 6px 18px rgba(0,33,111,0.08);
}
.empty-state h2{
  font-family:'Museo Sans Rounded Black','Museo Sans Rounded',sans-serif;
  font-weight:900;
  font-size:1.5rem;
  color: var(--navy);
  margin:0 0 10px;
}
.empty-state p{
  color: var(--gray);
  font-size:14px;
  max-width:420px;
  margin:0 auto;
  font-weight:300;
}

@media (max-width:480px){
  .day-grid{ grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
}
</style>
</head>

  const first = parseDate(days[0].date);
  const last = parseDate(days[days.length-1].date);
  const months = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  return first.getDate() + ' – ' + last.getDate() + ' ' + months[last.getMonth()];
}

function groupByWeek(days){
  const weeks = {};
  days.forEach(d=>{
    const dt = parseDate(d.date);
    const day = dt.getDay();
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const monday = new Date(dt);
    monday.setDate(dt.getDate() + diffToMonday);
    const key = monday.toISOString().slice(0,10);
    if(!weeks[key]) weeks[key] = [];
    weeks[key].push(d);
  });
  return Object.keys(weeks).sort().map(k => weeks[k]);
}

function dayCard(day, opts){
  const dt = parseDate(day.date);
  const now = todayMid();
  const diff = Math.round((dt-now)/86400000);
  let badge = '';
  if(!opts.past){
    if(diff === 0) badge = '<span class="badge hoy">HOY</span>';
    else if(diff === 1) badge = '<span class="badge proximo">MAÑANA</span>';
  }
  const label = day.dayName.charAt(0) + day.dayName.slice(1).toLowerCase();
  const dateLabel = String(dt.getDate()).padStart(2,'0') + '/' + String(dt.getMonth()+1).padStart(2,'0');
  const accent = WEEKDAY_ACCENT[day.dayName] || '#00216f';
  const items = day.items.filter(it => it.value).map(it => {
    const val = it.value.charAt(0) + it.value.slice(1).toLowerCase();
    return '<li><span class="lbl">' + it.label + '</span><span class="val">' + val + '</span></li>';
  }).join('');
  return '<div class="ticket" style="--accent:' + accent + '">' +
    '<div class="day-head" style="--accent:' + accent + '">' + badge +
    '<span class="day-name">' + label + '</span>' +
    '<span class="day-date">' + dateLabel + '</span>' +
    '</div>' +
    '<ul class="item-list" style="--accent:' + accent + '">' + items + '</ul>' +
  '</div>';
}

function render(mealKey){
  const now = todayMid();
  const allDays = DATA[mealKey];
  const upcoming = allDays.filter(d => parseDate(d.date) >= now);
  const past = allDays.filter(d => parseDate(d.date) < now);

  const upcomingEl = document.getElementById('upcoming-container');
  const historyEl = document.getElementById('history-container');
  const historyBtn = document.getElementById('history-btn');

  if(upcoming.length === 0){
    upcomingEl.innerHTML = '<div class="empty-state">' +
      '<h2>Este menú ya se sirvió por completo</h2>' +
      '<p>Todos los días de agosto ya pasaron. En cuanto se cargue el menú de septiembre, aparecerá aquí automáticamente.</p>' +
    '</div>';
  } else {
    const weeks = groupByWeek(upcoming);
    upcomingEl.innerHTML = weeks.map((wk, i) => {
      const num = i + 1;
      return '<div class="week-block">' +
        '<div class="week-label">' +
          '<span class="num">Semana ' + num + '</span>' +
          '<span class="range">' + fmtRange(wk) + '</span>' +
          '<span class="rule"></span>' +
        '</div>' +
        '<div class="day-grid">' + wk.map(d => dayCard(d, {past:false})).join('') + '</div>' +
      '</div>';
    }).join('');
  }

  if(past.length === 0){
    historyBtn.style.display = 'none';
    historyEl.innerHTML = '';
  } else {
    historyBtn.style.display = 'block';
    historyBtn.textContent = '▾ Ver semanas ya servidas (' + past.length + (past.length>1?' días)':' día)');
    const weeks = groupByWeek(past);
    historyEl.innerHTML = weeks.map((wk, i) => {
      return '<div class="week-block">' +
        '<div class="week-label">' +
          '<span class="num">Semana ' + (i+1) + '</span>' +
          '<span class="range">' + fmtRange(wk) + '</span>' +
          '<span class="rule"></span>' +
        '</div>' +
        '<div class="day-grid">' + wk.map(d => dayCard(d, {past:true})).join('') + '</div>' +
      '</div>';
    }).join('');
  }
}

let currentMeal = 'almuerzo';

document.getElementById('tab-almuerzo').addEventListener('click', () => {
  currentMeal = 'almuerzo';
  document.getElementById('tab-almuerzo').classList.add('active');
  document.getElementById('tab-cena').classList.remove('active');
  document.body.classList.remove('cena-mode');
  render(currentMeal);
});
document.getElementById('tab-cena').addEventListener('click', () => {
  currentMeal = 'cena';
  document.getElementById('tab-cena').classList.add('active');
  document.getElementById('tab-almuerzo').classList.remove('active');
  document.body.classList.add('cena-mode');
  render(currentMeal);
});

let historyOpen = false;
document.getElementById('history-btn').addEventListener('click', () => {
  historyOpen = !historyOpen;
  const el = document.getElementById('history-container');
  el.classList.toggle('open', historyOpen);
  const btn = document.getElementById('history-btn');
  btn.textContent = btn.textContent.replace(historyOpen ? '▾' : '▴', historyOpen ? '▴' : '▾');
});

(function(){
  const now = new Date();
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const label = 'Hoy es ' + dias[now.getDay()] + ' ' + now.getDate() + ' de ' + meses[now.getMonth()] + ' de ' + now.getFullYear();
  document.getElementById('today-label').textContent = label;
})();

render(currentMeal);
</script>
